name: Update context
# Keeps 问问立正 on the latest Open Context release (scripts/update_context.py). Pushing Open Context
# main approves its content; this changes no code. A failed run emails the owner.
on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy main even when the live service already answers from its release
        type: boolean
        default: false
  repository_dispatch:
    types: [open-context-release]
permissions: {}
concurrency:
  group: update-context
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    outputs:
      action: ${{ steps.check.outputs.action }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: scripts
          persist-credentials: false
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.deploy == true && '--deploy' || '' }}
        run: python3 scripts/update_context.py check $FORCE >> "$GITHUB_OUTPUT"
      # GitHub pauses a schedule after 60 days without repository activity; enabling it again keeps it running.
      - if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/update-context.yml/enable"
  update:
    needs: check
    if: needs.check.outputs.action != 'current'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # Holds AI_BUILDER_TOKEN, readable only by runs on main.
    environment: builder
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt pytest 'fakeredis[lua]'
      - env:
          AI_BUILDER_TOKEN: ${{ secrets.AI_BUILDER_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.deploy == true && '--deploy' || '' }}
        run: python scripts/update_context.py run $FORCE
