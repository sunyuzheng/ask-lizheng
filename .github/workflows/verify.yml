name: Verify public project
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest tests -q
      - run: python data/context/scripts/validate_release.py
      - run: npm ci
      - run: npm run build
      - run: docker build -t ask-lizheng .
